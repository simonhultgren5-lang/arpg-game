name: Pull Git LFS assets
description: Downloads the repo's Git LFS files (textures, audio, video …), cached between runs so the free LFS bandwidth isn't used up by every build.
runs:
  using: composite
  steps:
    - name: List LFS files
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
    - name: Cache LFS files
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
        restore-keys: lfs-
    - name: Check out LFS files
      shell: bash
      run: |
        git lfs pull
        rm -f .lfs-assets-id
        echo "LFS files: $(git lfs ls-files | wc -l)"
