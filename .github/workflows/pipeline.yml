# Assets are in Git LFS: the compile, test and package jobs fetch them (cached; see .github/actions/lfs-pull).
#
# Build pipeline: Developer commit → Build server → Compile → Test + Package → Automated QA → Deployment
#
# Runs on every push and pull request. Deployment only runs on main, and only when package.json has a
# version that isn't released yet: bump the version, merge, and the tested build is published. The
# "release" environment can require an approval first (Settings → Environments → release → Required
# reviewers). Versions like 0.4.1-beta.1 deploy to the beta channel as a GitHub pre-release.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  GODOT_VERSION: '4.7.2'

jobs:
  compile:
    name: Compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Patch notes from CHANGELOG.md
        run: node scripts/patch-notes.mjs
      - name: Compile (JavaScript syntax, JSON, GDScript)
        run: node scripts/ci/compile.mjs

  test:
    name: Test
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Tests (Godot smoke test, dev console; the game server runs in "Game server tests")
        run: node scripts/test.mjs

  # The game server stores its data in PostgreSQL, so its tests run where a PostgreSQL service
  # container is available (Linux runners). The Windows test job above skips them.
  server-test:
    name: Game server tests
    needs: compile
    runs-on: ubuntu-latest
    services:
      postgres:
        # The runner's pg_dump is 17 (and Docker uses 17); the same major version on both sides,
        # so the pg_dump backup path is tested too.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: depths
          POSTGRES_PASSWORD: depths
          POSTGRES_DB: depths
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depths -d depths"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the server's packages
        run: npm ci --prefix game-server --no-audit --no-fund
      - name: Game server, admin CLI, SQLite import, concurrency, restarts
        env:
          TEST_DATABASE_URL: postgres://depths:depths@127.0.0.1:5432/depths
        run: node --no-warnings --test game-server/tests/server.test.mjs

  package:
    name: Package
    needs: compile
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - name: Install packages
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'
      - id: version
        name: Version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the game, installer and server package
        run: node scripts/release.mjs --dry-run
      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/upload/
          retention-days: 14
      - name: Keep the unpacked app for QA
        uses: actions/upload-artifact@v4
        with:
          name: app-win-unpacked
          path: release/win-unpacked/
          retention-days: 3

  qa:
    name: Automated QA
    needs: [test, server-test, package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: app-win-unpacked
          path: release/win-unpacked/
      # The QA game server needs PostgreSQL. Windows runners come with it installed but stopped
      # (login postgres / root).
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'This runner has no PostgreSQL service.' }
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          "QA_DATABASE_URL=postgres://postgres:root@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
      - name: Install the server's packages
        run: npm ci --prefix game-server --no-audit --no-fund
      - name: Play the packaged app
        run: node scripts/ci/qa.mjs
      - name: Keep the QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14

  release-check:
    name: New version?
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released, so there is nothing to deploy. Bump the version to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deployment
    needs: [qa, package, release-check]
    if: needs.release-check.outputs.deploy == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: release/upload/
      - name: Publish the tested build
        run: node scripts/release.mjs --publish-only
      - name: Summary
        shell: bash
        run: echo "Published [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)." >> "$GITHUB_STEP_SUMMARY"
